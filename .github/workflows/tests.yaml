name: tests

on:
  push:
    branches:
      - '*.x'
  pull_request:
  workflow_dispatch:

jobs:
  tests-testbench-9:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
        php:
          - 8.3
          - 8.4
          - 8.5
        testbench:
          - 9
          - 10
          - 11
        dependencies:
          - "highest"
          - "lowest"
        experimental:
          - false
        exclude:
          - php: 8.5
            testbench: 9

    name: Testbench:${{ matrix.testbench }} / PHP:${{ matrix.php }} / OS:${{ matrix.os }} ${{ matrix.dependencies == 'highest' && '⬆️' || '⬇️' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, intl, fileinfo, :php-psr
          coverage: none

      - name: Install dependencies
        uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: "${{ matrix.dependencies }}"
          composer-options: "--prefer-dist --no-cache --with=orchestra/testbench:^${{ matrix.testbench }}"

      - name: Installed dependencies
        run: |
          composer show -D

      - name: Execute tests
        run: vendor/bin/pest --display-deprecations --fail-on-deprecation
