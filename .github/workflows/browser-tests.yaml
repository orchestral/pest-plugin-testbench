name: browser-tests

on:
  push:
    branches:
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-testbench-dusk:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
        php:
          - 8.4
          - 8.5
        testbench:
          - 11
        dependencies:
          - "highest"
        experimental:
          - false

    name: Dusk / Testbench:${{ matrix.testbench }} / PHP:${{ matrix.php }} / OS:${{ matrix.os }} ${{ matrix.dependencies == 'highest' && '⬆️' || '⬇️' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, intl, fileinfo, :php-psr
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: "${{ matrix.dependencies }}"
          composer-options: "--prefer-dist --no-cache --with=orchestra/testbench-dusk:${{ matrix.os == 'ubuntu-latest' && '^' || '~' }}${{ matrix.testbench }}.0"

      - name: Installed dependencies
        run: |
          composer show -D

      - name: Upgrade Chrome Driver & NPM
        run: |
          php vendor/bin/dusk-updater detect --auto-update
          npm ci

      - name: Create SQLite Database
        run: php vendor/bin/testbench-dusk package:create-sqlite-db

      - name: Start Chrome Driver
        run: ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 &

      - name: Execute tests (using Dusk)
        run: vendor/bin/pest -c phpunit.dusk.xml --display-deprecations --fail-on-deprecation --group=dusk
        env:
          APP_URL: http://127.0.0.1:8000
          DUSK_SERVE_PORT: 8000

  tests-playwright:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
        php:
          - 8.4
          - 8.5
        testbench:
          - 11
        dependencies:
          - "highest"
        experimental:
          - false

    name: Playwright / Testbench:${{ matrix.testbench }} / PHP:${{ matrix.php }} / OS:${{ matrix.os }} ${{ matrix.dependencies == 'highest' && '⬆️' || '⬇️' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, intl, fileinfo, :php-psr
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: "${{ matrix.dependencies }}"
          composer-options: "--prefer-dist --no-cache --with=orchestra/testbench-dusk:${{ matrix.os == 'ubuntu-latest' && '^' || '~' }}${{ matrix.testbench }}.0"

      - name: Installed dependencies
        run: |
          composer show -D

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install

      - name: Create SQLite Database
        run: php vendor/bin/testbench-dusk package:create-sqlite-db

      - name: Execute tests (using Pest Browser)
        run: vendor/bin/pest -c phpunit.dusk.xml --display-deprecations --fail-on-deprecation --group=pest
        env:
          APP_URL: http://127.0.0.1:8000
          DUSK_SERVE_PORT: 8000
